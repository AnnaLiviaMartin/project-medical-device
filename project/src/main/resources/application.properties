spring.application.name=medic-springboot

# --- Datenbank ---------------------------------------------------------
# Eingebettete, dateibasierte H2-DB: kein separater DB-Server noetig, um
# das Projekt sofort zu starten. Die Datei liegt neben dem Projekt unter
# ./data/medic.mv.db und bleibt zwischen Neustarts erhalten.
#
# Fuer den Produktivbetrieb stattdessen z. B.:
#   spring.datasource.url=jdbc:postgresql://localhost:5432/medic
#   spring.datasource.username=medic
#   spring.datasource.password=...
# (den passenden JDBC-Treiber ergaenzen)
spring.datasource.url=jdbc:h2:file:./medic-db;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

# H2-Konsole zum Reinschauen waehrend der Entwicklung (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Datei-Uploads -------------------------------------------------------
upload_dir=medic.storage.uploads

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- Thymeleaf -------------------------------------------------------------
spring.thymeleaf.cache=false

# --- Logging ---------------------------------------------------------------
logging.level.com.medic=INFO