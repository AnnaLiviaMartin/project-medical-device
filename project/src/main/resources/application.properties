spring.application.name=medic-springboot

# --- Datenbank ------------------------------------------------------------

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/database}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true


# --- H2-Konsole -----------------------------------------------------------

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# --- Datei-Uploads --------------------------------------------------------

upload_dir=${UPLOAD_DIR:./data/uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB


# --- Thymeleaf ------------------------------------------------------------

spring.thymeleaf.cache=false


# --- Logging --------------------------------------------------------------

logging.level.com.medic=INFO


# --- ML-Analyse -----------------------------------------------------------

ml.analysis.provider=${ML_ANALYSIS_PROVIDER:rest}
ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
ml.service.timeout-seconds=${ML_SERVICE_TIMEOUT_SECONDS:60}