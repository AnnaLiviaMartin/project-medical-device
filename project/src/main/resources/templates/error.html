<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: nav('patients')}"></div>
    <main class="main">
        <div class="card" style="max-width: 480px; margin-top: 60px; text-align: center;">
            <h2 style="font-size: 40px; color: var(--color-danger);" th:text="Error">Error</h2>
            <p th:text="Something went wrong while processing your request.">Error message</p>
            <a class="btn btn-primary" th:href="@{/patients}" th:text="#{}">Back to patient list</a>
        </div>
    </main>
</div>
</body>
</html>
