<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Error')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: nav('patients')}"></div>
    <main class="main">
        <div class="error-card">
            <h2 class="error-subtitle" th:text="#{error.generic.title}">Error</h2>
            <p th:text="#{error.generic.message}">Error message</p>
            <a class="btn btn-primary" th:href="@{/patients}" th:text="#{buttons.back}">Back to patient list</a>
        </div>
    </main>
</div>
</body>
</html>
