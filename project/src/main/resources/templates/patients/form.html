<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Edit Patient' : 'New Patient')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: nav('patients')}"></div>
    <!--TODO style auslagern in css-->
    <div class="main-content">
        <main class="form-page">
            <div class="pr-topbar">
                <a th:href="@{/patients}" class="back-link" th:text="#{}">← Back to Patient Overview</a>
            </div>

            <section class="form-hero">
                <p class="eyebrow" th:text="${isEdit} ? 'Edit Record' : 'Patient Management'">Patient Management</p>
                <h1 class="pr-title" th:text="${isEdit} ? 'Edit Patient' : 'New Patient'">New Patient</h1>
                <p class="pr-subtitle" th:text="#{}">Enter the patient's master data, contacts, and clinical baseline information.</p>
            </section>

            <form class="pr-form" method="post"
                  th:action="${isEdit} ? @{'/patients/' + ${patientId}} : @{/patients}"
                  th:object="${patientForm}">

                <section class="form-section">
                    <h2 class="form-section-title" th:text="#{}">Basic Information</h2>
                    <div class="form-grid3">
                        <label class="field" th:classappend="${#fields.hasErrors('firstName')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">First Name <span class="required-mark">*</span></span>
                            <input type="text" th:field="*{firstName}" placeholder="e.g. Anna"/>
                            <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('lastName')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Last Name <span class="required-mark">*</span></span>
                            <input type="text" th:field="*{lastName}" placeholder="e.g. Becker"/>
                            <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Date of Birth <span class="required-mark">*</span></span>
                            <input type="date" th:field="*{dateOfBirth}"/>
                            <span class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                        </label>

                        <label class="field">
                            <span class="field-label" th:text="#{}">Gender</span>
                            <select th:field="*{sex}">
                                <option th:each="option : ${T(de.hsrm.cs.master.medical.project.domain.Sex).values()}" th:value="${option}" th:text="${option.label}"></option>
                            </select>
                        </label>
                        <label class="field">
                            <span class="field-label" th:text="#{}">Status</span>
                            <select th:field="*{status}">
                                <option th:each="option : ${T(de.hsrm.cs.master.medical.project.domain.PatientStatus).values()}" th:value="${option}" th:text="${option.label}"></option>
                            </select>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('diagnosis')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Diagnosis <span class="required-mark">*</span></span>
                            <input type="text" th:field="*{diagnosis}" placeholder="e.g. Hypertension"/>
                            <span class="field-error" th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}"></span>
                        </label>

                        <label class="field" th:classappend="${#fields.hasErrors('doctor')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Attending Doctor <span class="required-mark">*</span></span>
                            <input type="text" th:field="*{doctor}" placeholder="e.g. Dr. Klein"/>
                            <span class="field-error" th:if="${#fields.hasErrors('doctor')}" th:errors="*{doctor}"></span>
                        </label>
                        <label class="field">
                            <span class="field-label" th:text="#{}">Ward / Unit</span>
                            <input type="text" th:field="*{ward}" placeholder="e.g. Ward 3"/>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('lastVisit')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Last Visit <span class="required-mark">*</span></span>
                            <input type="date" th:field="*{lastVisit}"/>
                            <span class="field-error" th:if="${#fields.hasErrors('lastVisit')}" th:errors="*{lastVisit}"></span>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('nextAppointment')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Next Appointment</span>
                            <input type="date" th:field="*{nextAppointment}"/>
                            <span class="field-error" th:if="${#fields.hasErrors('nextAppointment')}" th:errors="*{nextAppointment}"></span>
                        </label>
                    </div>
                </section>

                <section class="form-section">
                    <h2 class="form-section-title" th:text="#{}">Address</h2>
                    <div class="form-grid3">
                        <label class="field">
                            <span class="field-label" th:text="#{}">Street</span>
                            <input type="text" th:field="*{addressStreet}"/>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('addressZip')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">ZIP Code</span>
                            <input type="text" th:field="*{addressZip}"/>
                            <span class="field-error" th:if="${#fields.hasErrors('addressZip')}" th:errors="*{addressZip}"></span>
                        </label>
                        <label class="field">
                            <span class="field-label" th:text="#{}">City</span>
                            <input type="text" th:field="*{addressCity}"/>
                        </label>
                    </div>
                </section>

                <section class="form-section">
                    <h2 class="form-section-title" th:text="#{}">Emergency Contact</h2>
                    <div class="form-grid3">
                        <label class="field">
                            <span class="field-label" th:text="#{}">Name</span>
                            <input type="text" th:field="*{emergencyContactName}"/>
                        </label>
                        <label class="field">
                            <span class="field-label" th:text="#{}">Relation</span>
                            <input type="text" th:field="*{emergencyContactRelation}" placeholder="e.g. Spouse"/>
                        </label>
                        <label class="field" th:classappend="${#fields.hasErrors('emergencyContactPhone')} ? 'has-error'">
                            <span class="field-label" th:text="#{}">Phone</span>
                            <input type="text" th:field="*{emergencyContactPhone}" placeholder="+49 ..."/>
                            <span class="field-error" th:if="${#fields.hasErrors('emergencyContactPhone')}" th:errors="*{emergencyContactPhone}"></span>
                        </label>
                    </div>
                </section>

                <section class="form-section">
                    <h2 class="form-section-title" th:text="#{}">Insurance</h2>
                    <div class="form-grid3">
                        <label class="field">
                            <span class="field-label" th:text="#{}">Provider</span>
                            <input type="text" th:field="*{insuranceProvider}"/>
                        </label>
                        <label class="field">
                            <span class="field-label" th:text="#{}">Policy Number</span>
                            <input type="text" th:field="*{insurancePolicyNumber}"/>
                        </label>
                    </div>
                </section>

                <section class="form-section">
                    <h2 class="form-section-title" th:text="#{}">Allergies</h2>

                    <div class="inline-add-row">
                        <label class="field">
                            <input type="text" id="allergyInput" placeholder="e.g. Penicillin"/>
                        </label>
                        <button type="button" class="add-button" id="addAllergyBtn" th:text="#{}">+ Add</button>
                    </div>

                    <ul class="tag-list" id="allergyTagList"></ul>
                    <p class="empty-hint" id="allergyEmptyHint" th:text="#{}">No allergies added yet.</p>

                    <!-- Tatsaechlich gebundenes Feld: ein Eintrag pro Zeile, wird per JS synchron gehalten -->
                    <textarea th:field="*{allergiesRaw}" id="allergiesRaw" hidden></textarea>
                </section>

                <section class="form-section">
                    <div class="form-section-header-row">
                        <h2 class="form-section-title" th:text="#{}">Medications</h2>
                        <button type="button" class="add-button" onclick="addMedicationRow()" th:text="#{}">+ Add Medication</button>
                    </div>

                    <p class="empty-hint" id="medicationEmptyHint" style="display:none;" th:text="#{}">No medications added yet.</p>

                    <div class="medication-list" id="medication-rows">
                        <div class="medication-row" th:each="med, medStat : *{medications}" th:attr="data-index=${medStat.index}">
                            <label class="field">
                                <input type="text" th:field="*{medications[__${medStat.index}__].name}" placeholder="Name (e.g. Metformin)"/>
                                <span class="field-error" th:if="${#fields.hasErrors('medications[' + medStat.index + '].name')}" th:errors="*{medications[__${medStat.index}__].name}"></span>
                            </label>
                            <label class="field">
                                <input type="text" th:field="*{medications[__${medStat.index}__].dosage}" placeholder="Dosage (e.g. 1000 mg)"/>
                                <span class="field-error" th:if="${#fields.hasErrors('medications[' + medStat.index + '].dosage')}" th:errors="*{medications[__${medStat.index}__].dosage}"></span>
                            </label>
                            <label class="field">
                                <input type="text" th:field="*{medications[__${medStat.index}__].schedule}" placeholder="Schedule (e.g. 2x daily)"/>
                                <span class="field-error" th:if="${#fields.hasErrors('medications[' + medStat.index + '].schedule')}" th:errors="*{medications[__${medStat.index}__].schedule}"></span>
                            </label>
                            <button type="button" class="row-remove-button" onclick="removeMedicationRow(this)" aria-label="Remove medication">x</button>
                        </div>
                    </div>
                </section>

                <div class="form-actions">
                    <a th:href="${isEdit} ? @{'/patients/' + ${patientId}} : @{/patients}" class="cancel-button" th:text="#{}">Cancel</a>
                    <button type="submit" class="submit-button" th:text="${isEdit} ? 'Save Changes' : 'Create Patient'">Create Patient</button>
                </div>
            </form>
        </main>
    </div>
</div>

<script th:inline="javascript">
    // --- Allergies: JS-verwaltete Tag-Liste, synchronisiert mit dem versteckten
    //     Textarea-Feld (allergiesRaw), das tatsaechlich an den Server gesendet wird.
    (function () {
        var hiddenField = document.getElementById('allergiesRaw');
        var tagList = document.getElementById('allergyTagList');
        var emptyHint = document.getElementById('allergyEmptyHint');
        var input = document.getElementById('allergyInput');
        var addBtn = document.getElementById('addAllergyBtn');

        function currentAllergies() {
            return hiddenField.value.split('\n').map(function (s) { return s.trim(); }).filter(function (s) { return s.length > 0; });
        }

        function render() {
            var allergies = currentAllergies();
            tagList.innerHTML = '';
            emptyHint.style.display = allergies.length === 0 ? 'block' : 'none';
            allergies.forEach(function (allergy, index) {
                var li = document.createElement('li');
                li.className = 'tag';
                li.textContent = allergy + ' ';
                var removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'tag-remove';
                removeBtn.setAttribute('aria-label', 'Remove ' + allergy);
                removeBtn.textContent = 'x';
                removeBtn.onclick = function () {
                    var updated = currentAllergies();
                    updated.splice(index, 1);
                    hiddenField.value = updated.join('\n');
                    render();
                };
                li.appendChild(removeBtn);
                tagList.appendChild(li);
            });
        }

        function addAllergy() {
            var trimmed = input.value.trim();
            if (!trimmed) return;
            var updated = currentAllergies();
            updated.push(trimmed);
            hiddenField.value = updated.join('\n');
            input.value = '';
            render();
        }

        addBtn.addEventListener('click', addAllergy);
        input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addAllergy();
            }
        });

        render();
    })();

    // --- Medications: Zeilen hinzufuegen/entfernen, Indizes nach jeder
    //     Aenderung neu durchnummerieren, damit Spring die Liste sauber bindet.
    function reindexMedicationRows() {
        var rows = document.querySelectorAll('#medication-rows .medication-row');
        rows.forEach(function (row, i) {
            row.setAttribute('data-index', i);
            row.querySelectorAll('input').forEach(function (input) {
                input.name = input.name.replace(/medications\[\d+\]/, 'medications[' + i + ']');
            });
        });
        document.getElementById('medicationEmptyHint').style.display = rows.length === 0 ? 'block' : 'none';
    }

    var medicationRowTemplate =
        '<div class="medication-row">' +
        '<label class="field"><input type="text" name="medications[0].name" placeholder="Name (e.g. Metformin)"/></label>' +
        '<label class="field"><input type="text" name="medications[0].dosage" placeholder="Dosage (e.g. 1000 mg)"/></label>' +
        '<label class="field"><input type="text" name="medications[0].schedule" placeholder="Schedule (e.g. 2x daily)"/></label>' +
        '<button type="button" class="row-remove-button" onclick="removeMedicationRow(this)" aria-label="Remove medication">x</button>' +
        '</div>';

    function addMedicationRow() {
        var container = document.getElementById('medication-rows');
        var wrapper = document.createElement('div');
        wrapper.innerHTML = medicationRowTemplate;
        container.appendChild(wrapper.firstElementChild);
        reindexMedicationRows();
    }

    function removeMedicationRow(button) {
        var row = button.closest('.medication-row');
        row.parentElement.removeChild(row);
        reindexMedicationRows();
    }

    reindexMedicationRows();
</script>
</body>
</html>
