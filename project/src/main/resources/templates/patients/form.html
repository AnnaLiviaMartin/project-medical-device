<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${isEdit} ? 'Edit patient' : 'New patient')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: nav('new-patient')}"></div>

    <main class="main">
        <div class="page-header">
            <div>
                <span class="page-eyebrow" th:text="${isEdit} ? 'Edit record' : 'Admission'">Admission</span>
                <h1 th:text="${isEdit} ? 'Edit patient' : 'Admit new patient'">New patient</h1>
            </div>
        </div>

        <form method="post"
              th:action="${isEdit} ? @{'/patients/' + ${patientId}} : @{/patients}"
              th:object="${patientForm}">

            <div class="card">
                <h2>Basic information</h2>
                <div class="form-grid">
                    <div class="form-field" th:classappend="${#fields.hasErrors('firstName')} ? 'has-error'">
                        <label for="firstName">First name *</label>
                        <input type="text" id="firstName" th:field="*{firstName}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('lastName')} ? 'has-error'">
                        <label for="lastName">Last name *</label>
                        <input type="text" id="lastName" th:field="*{lastName}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></span>
                    </div>

                    <div class="form-field" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'has-error'">
                        <label for="dateOfBirth">Date of birth *</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('sex')} ? 'has-error'">
                        <label for="sex">Sex *</label>
                        <select id="sex" th:field="*{sex}">
                            <option value="">— Select —</option>
                            <option th:each="option : ${T(de.hsrm.cs.master.medical.project.domain.Sex).values()}"
                                    th:value="${option}" th:text="${option.label}"></option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('sex')}" th:errors="*{sex}"></span>
                    </div>

                    <div class="form-field" th:classappend="${#fields.hasErrors('diagnosis')} ? 'has-error'">
                        <label for="diagnosis">Diagnosis *</label>
                        <input type="text" id="diagnosis" th:field="*{diagnosis}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('diagnosis')}" th:errors="*{diagnosis}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('status')} ? 'has-error'">
                        <label for="status">Status *</label>
                        <select id="status" th:field="*{status}">
                            <option th:each="option : ${T(de.hsrm.cs.master.medical.project.domain.PatientStatus).values()}"
                                    th:value="${option}" th:text="${option.label}"></option>
                        </select>
                        <span class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></span>
                    </div>

                    <div class="form-field" th:classappend="${#fields.hasErrors('lastVisit')} ? 'has-error'">
                        <label for="lastVisit">Last visit *</label>
                        <input type="date" id="lastVisit" th:field="*{lastVisit}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('lastVisit')}" th:errors="*{lastVisit}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('nextAppointment')} ? 'has-error'">
                        <label for="nextAppointment">Next appointment</label>
                        <input type="date" id="nextAppointment" th:field="*{nextAppointment}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('nextAppointment')}" th:errors="*{nextAppointment}"></span>
                    </div>

                    <div class="form-field" th:classappend="${#fields.hasErrors('doctor')} ? 'has-error'">
                        <label for="doctor">Attending doctor *</label>
                        <input type="text" id="doctor" th:field="*{doctor}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('doctor')}" th:errors="*{doctor}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('ward')} ? 'has-error'">
                        <label for="ward">Ward</label>
                        <input type="text" id="ward" th:field="*{ward}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('ward')}" th:errors="*{ward}"></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Address</h2>
                <div class="form-grid">
                    <div class="form-field" th:classappend="${#fields.hasErrors('addressStreet')} ? 'has-error'">
                        <label for="addressStreet">Street</label>
                        <input type="text" id="addressStreet" th:field="*{addressStreet}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('addressStreet')}" th:errors="*{addressStreet}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('addressZip')} ? 'has-error'">
                        <label for="addressZip">Postal code</label>
                        <input type="text" id="addressZip" th:field="*{addressZip}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('addressZip')}" th:errors="*{addressZip}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('addressCity')} ? 'has-error'">
                        <label for="addressCity">City</label>
                        <input type="text" id="addressCity" th:field="*{addressCity}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('addressCity')}" th:errors="*{addressCity}"></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Emergency contact</h2>
                <div class="form-grid">
                    <div class="form-field" th:classappend="${#fields.hasErrors('emergencyContactName')} ? 'has-error'">
                        <label for="emergencyContactName">Name</label>
                        <input type="text" id="emergencyContactName" th:field="*{emergencyContactName}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('emergencyContactName')}" th:errors="*{emergencyContactName}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('emergencyContactRelation')} ? 'has-error'">
                        <label for="emergencyContactRelation">Relationship</label>
                        <input type="text" id="emergencyContactRelation" th:field="*{emergencyContactRelation}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('emergencyContactRelation')}" th:errors="*{emergencyContactRelation}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('emergencyContactPhone')} ? 'has-error'">
                        <label for="emergencyContactPhone">Phone</label>
                        <input type="text" id="emergencyContactPhone" th:field="*{emergencyContactPhone}" placeholder="+49 611 1234567"/>
                        <span class="field-error" th:if="${#fields.hasErrors('emergencyContactPhone')}" th:errors="*{emergencyContactPhone}"></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Insurance</h2>
                <div class="form-grid">
                    <div class="form-field" th:classappend="${#fields.hasErrors('insuranceProvider')} ? 'has-error'">
                        <label for="insuranceProvider">Provider</label>
                        <input type="text" id="insuranceProvider" th:field="*{insuranceProvider}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('insuranceProvider')}" th:errors="*{insuranceProvider}"></span>
                    </div>
                    <div class="form-field" th:classappend="${#fields.hasErrors('insurancePolicyNumber')} ? 'has-error'">
                        <label for="insurancePolicyNumber">Policy number</label>
                        <input type="text" id="insurancePolicyNumber" th:field="*{insurancePolicyNumber}"/>
                        <span class="field-error" th:if="${#fields.hasErrors('insurancePolicyNumber')}" th:errors="*{insurancePolicyNumber}"></span>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>Allergies</h2>
                <div class="form-field">
                    <label for="allergiesRaw">One allergy per line</label>
                    <textarea id="allergiesRaw" th:field="*{allergiesRaw}" placeholder="Penicillin&#10;Latex"></textarea>
                </div>
            </div>

            <div class="card">
                <h2>Medications</h2>
                <div class="dynamic-rows" id="medication-rows">
                    <div class="dynamic-row" th:each="med, medStat : *{medications}" th:attr="data-index=${medStat.index}">
                        <div class="form-field">
                            <label>Medication name</label>
                            <input type="text" th:field="*{medications[__${medStat.index}__].name}" placeholder="e.g. Ibuprofen"/>
                            <span class="field-error" th:if="${#fields.hasErrors('medications[' + medStat.index + '].name')}" th:errors="*{medications[__${medStat.index}__].name}"></span>
                        </div>
                        <div class="form-field">
                            <label>Dosage</label>
                            <input type="text" th:field="*{medications[__${medStat.index}__].dosage}" placeholder="e.g. 400mg"/>
                            <span class="field-error" th:if="${#fields.hasErrors('medications[' + medStat.index + '].dosage')}" th:errors="*{medications[__${medStat.index}__].dosage}"></span>
                        </div>
                        <div class="form-field">
                            <label>Schedule</label>
                            <input type="text" th:field="*{medications[__${medStat.index}__].schedule}" placeholder="e.g. 2x daily"/>
                            <span class="field-error" th:if="${#fields.hasErrors('medications[' + medStat.index + '].schedule')}" th:errors="*{medications[__${medStat.index}__].schedule}"></span>
                        </div>
                    </div>
                </div>
                <button type="button" class="add-row-btn" onclick="addMedicationRow()" style="margin-top: 10px;">+ Add medication row</button>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${isEdit} ? 'Save changes' : 'Admit patient'">Save</button>
                <a class="btn btn-secondary"
                   th:href="${isEdit} ? @{'/patients/' + ${patientId}} : @{/patients}">Cancel</a>
            </div>
        </form>
    </main>
</div>

<script th:inline="javascript">
    function addMedicationRow() {
        const container = document.getElementById('medication-rows');
        const rows = container.querySelectorAll('.dynamic-row');
        const template = rows[0].cloneNode(true);
        const oldIndex = rows[rows.length - 1].getAttribute('data-index');
        const newIndex = parseInt(oldIndex, 10) + 1;

        template.setAttribute('data-index', newIndex);
        template.querySelectorAll('input').forEach(function (input) {
            input.name = input.name.replace('medications[' + rows[0].getAttribute('data-index') + ']', 'medications[' + newIndex + ']');
            input.removeAttribute('id');
            input.value = '';
        });
        template.querySelectorAll('.field-error').forEach(function (el) { el.remove(); });
        container.appendChild(template);
    }
</script>
</body>
</html>
