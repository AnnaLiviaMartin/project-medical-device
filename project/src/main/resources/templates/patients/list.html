<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Patient Overview')}"></head>
<body>
<div class="app-shell">
    <div th:replace="~{fragments/nav :: nav('patients')}"></div>

    <div class="main-content">
        <div th:replace="~{fragments/flash :: flash}"></div>

        <main class="pr-page">
            <section class="pr-hero">
                <div>
                    <p class="eyebrow">Patient Management</p>
                    <h1 class="ov-title">Patient Overview</h1>
                    <p class="ov-subtitle">Overview of master data, address information, and emergency contacts.</p>
                </div>
                <a href="#" th:href="@{/patients/new}" class="btn-primary">+ New Patient</a>
            </section>

            <section>
                <div class="panel">
                    <form class="ov-toolbar" method="get" th:action="@{/patients}">
                        <input class="text-input" type="text" name="q" th:value="${query}"
                               placeholder="Search by name, ID, city, or emergency contact"/>
                        <select class="select-input" name="status" onchange="this.form.submit()">
                            <option value="All" th:selected="${statusFilter == 'All'}">All</option>
                            <option value="INPATIENT" th:selected="${statusFilter == 'INPATIENT'}">Inpatient
                            </option>
                            <option value="OUTPATIENT" th:selected="${statusFilter == 'OUTPATIENT'}">Outpatient
                            </option>
                        </select>
                        <button class="btn-primary" type="submit">Search</button>
                    </form>

                    <div class="ov-table-header">
                        <span>Patient</span>
                        <span>Address</span>
                        <span>Emergency Contact</span>
                    </div>

                    <div class="ov-list">
                        <a th:each="patient : ${patients}"
                           th:href="@{/patients/{id}(id=${patient.id})}"
                           class="ov-row">
                            <div class="name-block">
                                <div class="name-row">
                                    <strong class="patient-name" th:text="${patient.fullName}">Name</strong>
                                    <span class="id-badge" th:text="'#' + ${patient.id}">#1</span>
                                    <span class="status-badge"
                                          th:classappend="${patient.status.name() == 'OUTPATIENT'} ? 'status-badge--outpatient-list' : 'status-badge--inpatient-list'"
                                          th:text="${patient.status.label}">Status</span>
                                </div>
                                <span class="meta-text"
                                      th:text="${patient.age} + ' years · ' + ${patient.sex.label}">Meta</span>
                            </div>

                            <div class="name-block">
                                <strong class="patient-name"
                                        th:text="${#strings.isEmpty(patient.addressStreet)} ? '—' : ${patient.addressStreet}">Street</strong>
                                <span class="meta-text"
                                      th:text="${patient.addressZip} + ' ' + ${patient.addressCity}">Zip city</span>
                            </div>

                            <div class="name-block">
                                <strong class="patient-name"
                                        th:text="${#strings.isEmpty(patient.emergencyContactName)} ? '—' : ${patient.emergencyContactName}">Contact</strong>
                                <span class="meta-text"
                                      th:text="${patient.emergencyContactRelation} + ' · ' + ${patient.emergencyContactPhone}">Relation</span>
                            </div>
                        </a>

                        <div class="empty-state" th:if="${#lists.isEmpty(patients)}">
                            No patients found for this search.
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>
</div>
</body>
</html>
