# Lokaler Test des kompletten, produktionsnahen Setups (gleiche Images
# wie fuer Azure). Aufruf aus dem Projekt-Root:
#
#   docker compose up --build
#
# Frontend danach unter http://localhost:3000, Backend unter
# http://localhost:8000 erreichbar. Daten (SQLite + Media) landen im
# lokalen Ordner ./data und ueberleben damit `docker compose down`/`up`.
#
# Voraussetzung: machine_learning/nih_train.py, machine_learning/constants.py
# und machine_learning/checkpoints/best_model.pt muessen vorhanden sein
# (siehe DEPLOYMENT.md).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: "local-dev-secret-not-for-production"
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "backend,localhost,127.0.0.1"
      DJANGO_CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      DJANGO_DB_PATH: "/data/db.sqlite3"
      DJANGO_MEDIA_ROOT: "/data/media"
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: "http://localhost:8000"
    environment:
      # Server-seitige Next.js-Calls (Server Components) laufen im
      # Container und muessen das Backend ueber den Docker-Compose-
      # Servicenamen ansprechen, nicht ueber "localhost". Laufzeit-Env,
      # kein Rebuild noetig. Siehe Kommentar in patients.api.tsx etc.
      INTERNAL_API_URL: "http://backend:8000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
